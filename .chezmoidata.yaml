name: "Jamie Kirkpatrick"
email: "jkp@kirkconsulting.co.uk"

# The personal 1Password account, by sign-in address (`op account list`): every
# op:// reference in this repo is in its Private vault. op otherwise reads
# from whichever account it last used, and the work one has no such items.
onePasswordAccount: "kirkpatrick.1password.com"

# Scheduled jobs per machine, by hostname. Only a Mac listed here gets the
# pitchfork supervisor and ~/.config/pitchfork-jobs; every other machine,
# including Linux, gets none of it.
jobs:
  tkol: [worktree-reap, backup-exclusions, accounts-backup, network-config-drift]

# Agent plugins for Claude Code and Codex, from GitHub marketplaces.
# modify_ templates declare them; run_onchange_after_install-agent-skills installs them.
agentPlugins:
  - id: ponytail@ponytail
    marketplace: ponytail
    repo: DietrichGebert/ponytail

# Plugin MCP servers Claude Code never loads. A project can't override this:
# to use one, delete its line and apply.
claudeDeniedMcpServers:
  - plugin:small-business:airwallex
  - plugin:small-business:apollo-io
  - plugin:small-business:atlassian
  - plugin:small-business:canva
